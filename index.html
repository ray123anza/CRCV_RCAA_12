<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRCV_RCAA</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <audio id="backgroundMusic" autoplay loop preload="auto">
        <source src="varios/cancion1.mp3" type="audio/mpeg">
    </audio>

    <main class="app">

        <!-- =========================================
             ETAPA 1: CONTADOR
             ========================================= -->
        <section id="countdownScreen" class="screen active">

            <div class="countdown-container">


                <div class="countdown">

                    <div class="time-box">
                        <span id="days" class="number">00</span>
                        <span class="label">DÍAS</span>
                    </div>

                    <span class="separator">:</span>

                    <div class="time-box">
                        <span id="hours" class="number">00</span>
                        <span class="label">HORAS</span>
                    </div>

                    <span class="separator">:</span>

                    <div class="time-box">
                        <span id="minutes" class="number">00</span>
                        <span class="label">MINUTOS</span>
                    </div>

                    <span class="separator">:</span>

                    <div class="time-box">
                        <span id="seconds" class="number">00</span>
                        <span class="label">SEGUNDOS</span>
                    </div>

                </div>

            </div>

        </section>


        <!-- =========================================
             FUTURAS ETAPAS
             
             Por ahora permanecen ocultas.
             
             Más adelante podremos añadir:
             
             1. Código
             2. Audio
             3. Video
             
             ========================================= -->

        <!--
        <section id="codeScreen" class="screen">
            Aquí irá el código...
        </section>

        <section id="audioScreen" class="screen">
            Aquí irá el audio...
        </section>

        <section id="videoScreen" class="screen">
            Aquí irá el video...
        </section>
        -->

    </main>

    <script src="script.js"></script>

    </div>

    <!-- =====================================
     BOTÓN SECRETO DEL FANTASMA
===================================== -->

<div id="ghostOverlay" class="ghost-overlay">

    <!-- Fantasma: botón secreto -->
    <button
        id="ghostButton"
        class="ghost-button"
        type="button"
        aria-label="Descubrir mensaje secreto"
    >
        <img
            src="varios/fantasma.png"
            alt="Fantasma"
            id="ghostImage"
        >
    </button>

    <!-- Mensaje secreto: oculto al iniciar -->
    <div id="ghostMessage" class="ghost-message" hidden>
        <p>Revisa el casillero</p>
        <p>Atte. El señor</p>
    </div>

</div>

<script src="script.js"></script>
</body>

</body>

</html>
